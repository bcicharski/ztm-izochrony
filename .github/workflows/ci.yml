# Lint + testy silnika przy każdym pushu i PR — żeby zmiana w routerze
# nie zepsuła cicho wyników (dotąd wszystko było weryfikowane ręcznie).
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['data/**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
